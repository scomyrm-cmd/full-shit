name: Campus OS CI

on:
  push:
    branches: [main, vercel-migration]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campus-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: campus-os/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:i18n
